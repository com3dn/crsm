// 🔹 Monta a tabela dinamicamente
const table = document.getElementById("videoTable");

videos.forEach(v => {
  const tr = document.createElement("tr");

  // Célula do vídeo
  const tdVideo = document.createElement("td");
  tdVideo.innerHTML = `
    <div class="video-container" onclick="loadVideo(this, '${v.id}')">
      <img src="${v.thumbnail}" alt="Thumbnail ${v.titulo}">
      <div class="play-button">▶</div>
    </div>`;
  tr.appendChild(tdVideo);

  // Célula da descrição
  const tdDesc = document.createElement("td");
  tdDesc.classList.add("desc");
  tdDesc.innerHTML = `
    <h3>${v.titulo}</h3>
    <p><b>Última atualização:</b> ${v.atualizacao}</p>
    <p>Após a conclusão desta lição, o formando será capaz de:</p>
    <ul>${v.objetivos.map(o => `<li>${o}</li>`).join("")}</ul>
    <a href="${v.material}" target="_blank" style="vertical-align:bottom;" class="material">📥 Materiais de aula</a>
  `;
  tr.appendChild(tdDesc);

  table.appendChild(tr);
});

// 🔹 Função para carregar o iframe só quando clicar
function loadVideo(container, videoId) {
  container.innerHTML = `
    <iframe width="420" height="330"
      src="https://drive.google.com/file/d/${videoId}/preview"
      frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
    </iframe>`;
}
