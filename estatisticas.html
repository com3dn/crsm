<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estatísticas</title>
</head>
<body>
  <h2>Dados de Acessos</h2>
  <pre id="saida"></pre>

  <script>
    async function carregarDados() {
      try {
        const url = "https://script.google.com/macros/s/AKfycbzWCl3Jx_x4V2ESz2QBmS_TvLxW4yofua51-I2hbP9RSY-LISgaKOjq4sYXHXMo_NVY/exec"; // sua URL do Web App

        const resposta = await fetch(url, {
          method: "GET",
          mode: "cors" // garante que faça a requisição cross-origin
        });

        if (!resposta.ok) {
          throw new Error("Erro na resposta: " + resposta.status);
        }

        const dados = await resposta.json();
        document.getElementById("saida").textContent = JSON.stringify(dados, null, 2);
      } catch (erro) {
        console.error("Erro ao carregar dados:", erro);
        document.getElementById("saida").textContent = "Falha ao carregar dados.";
      }
    }

    carregarDados();
  </script>
</body>
</html>
